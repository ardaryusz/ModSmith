[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modsmith"
version = "1.0.1"
description = "Local automation tool for generating recipe-only Minecraft mods across multiple loaders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
keywords = ["minecraft", "mod", "forge", "fabric", "neoforge", "recipe"]

[project.scripts]
modsmith = "modsmith.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modsmith*"]

[project.optional-dependencies]
dev = ["pytest>=7", "Pillow>=10.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
